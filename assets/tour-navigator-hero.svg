<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" width="900" height="280">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7971e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd200" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg1)"/>

  <!-- Glow blobs -->
  <ellipse cx="720" cy="80" rx="180" ry="120" fill="#f7971e" opacity="0.12" filter="url(#blur1)"/>
  <ellipse cx="160" cy="200" rx="140" ry="100" fill="#302b63" opacity="0.6" filter="url(#blur1)"/>

  <!-- Grid dots -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="900" height="280" fill="url(#dots)"/>
  </g>

  <!-- Tour step connectors (visual metaphor) -->
  <!-- Step 1 node -->
  <circle cx="530" cy="80" r="22" fill="#1a1a3e" stroke="#f7971e" stroke-width="2"/>
  <circle cx="530" cy="80" r="14" fill="url(#accent1)" opacity="0.9"/>
  <text x="530" y="85" font-family="monospace" font-size="12" fill="#0f0c29" text-anchor="middle" font-weight="bold">1</text>

  <!-- Step 2 node -->
  <circle cx="660" cy="150" r="22" fill="#1a1a3e" stroke="#ffd200" stroke-width="2"/>
  <circle cx="660" cy="150" r="14" fill="#ffd200" opacity="0.9"/>
  <text x="660" y="155" font-family="monospace" font-size="12" fill="#0f0c29" text-anchor="middle" font-weight="bold">2</text>

  <!-- Step 3 node -->
  <circle cx="780" cy="100" r="22" fill="#1a1a3e" stroke="#f7971e" stroke-width="2"/>
  <circle cx="780" cy="100" r="14" fill="url(#accent1)" opacity="0.9"/>
  <text x="780" y="105" font-family="monospace" font-size="12" fill="#0f0c29" text-anchor="middle" font-weight="bold">3</text>

  <!-- Connecting lines -->
  <line x1="552" y1="88" x2="638" y2="140" stroke="#f7971e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <line x1="682" y1="140" x2="758" y2="108" stroke="#ffd200" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Tooltip popup at step 1 -->
  <rect x="548" y="38" rx="8" ry="8" width="140" height="36" fill="#1e1b4b" stroke="#f7971e" stroke-width="1.5" opacity="0.95"/>
  <text x="618" y="54" font-family="monospace" font-size="9" fill="#ffd200" text-anchor="middle">Step 1 of 3</text>
  <text x="618" y="66" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">Click to continue →</text>
  <!-- Arrow pointer -->
  <polygon points="580,74 590,74 585,80" fill="#f7971e" opacity="0.9"/>

  <!-- Highlight overlay on a "button" -->
  <rect x="535" y="190" rx="6" ry="6" width="90" height="28" fill="none" stroke="#f7971e" stroke-width="2" opacity="0.7" stroke-dasharray="4,3"/>
  <text x="580" y="209" font-family="monospace" font-size="9" fill="#f7971e" text-anchor="middle" opacity="0.8">Get Started</text>

  <!-- Spotlight pulse -->
  <circle cx="530" cy="80" r="30" fill="none" stroke="#ffd200" stroke-width="1" opacity="0.3"/>
  <circle cx="530" cy="80" r="40" fill="none" stroke="#ffd200" stroke-width="0.5" opacity="0.15"/>

  <!-- Left side: Title block -->
  <rect x="48" y="60" width="4" height="60" rx="2" fill="url(#accent1)"/>
  <text x="68" y="90" font-family="Georgia, serif" font-size="32" fill="#ffffff" font-weight="700" letter-spacing="-0.5">tour-navigator</text>
  <text x="68" y="114" font-family="monospace" font-size="13" fill="#a78bfa">React · Guided Product Tours</text>

  <!-- Tagline -->
  <text x="68" y="155" font-family="Georgia, serif" font-size="14" fill="#e2d9f3" opacity="0.85">Step-by-step UI walkthroughs for React apps.</text>
  <text x="68" y="174" font-family="Georgia, serif" font-size="14" fill="#e2d9f3" opacity="0.85">Highlight overlays · Custom tooltips · Zero deps.</text>

  <!-- Badges row -->
  <rect x="68" y="198" rx="12" ry="12" width="70" height="22" fill="#f7971e" opacity="0.15" stroke="#f7971e" stroke-width="1"/>
  <text x="103" y="213" font-family="monospace" font-size="9" fill="#ffd200" text-anchor="middle">npm install</text>

  <rect x="148" y="198" rx="12" ry="12" width="56" height="22" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1"/>
  <text x="176" y="213" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">MIT License</text>

  <rect x="214" y="198" rx="12" ry="12" width="80" height="22" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-width="1"/>
  <text x="254" y="213" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">TypeScript ✓</text>

  <!-- Bottom bar -->
  <rect x="0" y="270" width="900" height="10" fill="url(#accent1)" opacity="0.5"/>
</svg>
